<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saarvik-India</title>
    <link rel="stylesheet" href="./style.css">
   
</head>
<body>
   
    <div class="page-body flex-data">
        <div class="logo-set">
            <img src="../assets/images/case-matrix-logo.jpg" style="width: 3rem;background-color: black;" alt="">
        </div>
      <div class="flex-body">
        <div class="title-intro"><h2>Saarvik-India</h2></div>
        <div class="title-intro"><h2>We are coming soon<span class="title-color">!</span></h2></div>   
<div class="timer-view flex-data">
  <div class="flex-data timer-show">
    <span id="daysLeft"></span>
    <p>Day(s)</p>
  </div>

  <div class="flex-data time-separate">
    <div class="radio-box flex-data"><span></span></div>
    <div class="radio-box flex-data"><span></span></div>
  </div>

  <div class="flex-data timer-show">
    <span id="hoursLeft"></span>
    <p>hours</p>
  </div>

  <div class="flex-data time-separate">
    <div class="radio-box flex-data"><span></span></div>
    <div class="radio-box flex-data"><span></span></div>
  </div>

  <div class="flex-data timer-show">
    <span id="minutesLeft"></span>
    <p>minutes</p>
  </div>

  <div class="flex-data time-separate">
    <div class="radio-box flex-data"><span></span></div>
    <div class="radio-box flex-data"><span></span></div>
  </div>

  <div class="flex-data timer-show">
    <span id="secondsLeft"></span>
    <p>seconds</p>
  </div>
</div>
      </div>
      </div>
